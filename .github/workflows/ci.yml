name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Build first so Next generates .next/types that next-env.d.ts references,
      # then type-check against them.
      - run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      - run: npm run typecheck

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jfmcss
          POSTGRES_PASSWORD: jfmcss
          POSTGRES_DB: jfmcss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jfmcss" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jfmcss:jfmcss@127.0.0.1:5432/jfmcss_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Only the *.itest.ts suites do real DB work; they run because DATABASE_URL is set.
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the job on any high/critical advisory; review before bumping.
      - run: npm audit --audit-level=high
